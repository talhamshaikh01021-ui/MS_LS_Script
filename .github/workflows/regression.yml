name: MouthShut Regression Automation & Live Status Report

on:
  schedule:
    # Run daily at 04:00 UTC (09:30 AM IST)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Regression Suite to Run (all = Desktop + Mobile in parallel)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - desktop
          - mobile
      desktop_url:
        description: 'Desktop Base URL'
        required: false
        default: 'https://beta.mouthshut.com'
      mobile_url:
        description: 'Mobile Base URL'
        required: false
        default: 'https://mbeta.mouthshut.com'
  push:
    branches:
      - main
      - master
      - mouthshut-regression

permissions:
  contents: read

jobs:
  regression-test:
    name: Execute Desktop & Mobile Master Regression Suites
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Playwright Chromium with OS Dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Regression Suite
        env:
          CI: true
          DESKTOP_BASE_URL: ${{ github.event.inputs.desktop_url || 'https://beta.mouthshut.com' }}
          MOBILE_BASE_URL: ${{ github.event.inputs.mobile_url || 'https://mbeta.mouthshut.com' }}
          TEST_DATA_JSON: ${{ secrets.TEST_DATA_JSON }}
          DESKTOP_EMAIL_ID: ${{ secrets.DESKTOP_EMAIL_ID }}
          DESKTOP_APP_PASSWORD: ${{ secrets.DESKTOP_APP_PASSWORD }}
          DESKTOP_MSID: ${{ secrets.DESKTOP_MSID }}
          DESKTOP_PASSWORD: ${{ secrets.DESKTOP_PASSWORD }}
          MOBILE_EMAIL_ID: ${{ secrets.MOBILE_EMAIL_ID }}
          MOBILE_APP_PASSWORD: ${{ secrets.MOBILE_APP_PASSWORD }}
          MOBILE_MSID: ${{ secrets.MOBILE_MSID }}
          MOBILE_PASSWORD: ${{ secrets.MOBILE_PASSWORD }}
          REPORT_SENDER_EMAIL: ${{ secrets.REPORT_SENDER_EMAIL }}
          REPORT_SENDER_PASSWORD: ${{ secrets.REPORT_SENDER_PASSWORD }}
          REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
        run: |
          SUITE="${{ github.event.inputs.suite || 'all' }}"
          echo "Executing suite: $SUITE"
          if [ "$SUITE" = "desktop" ]; then
            pnpm run test:desktop
          elif [ "$SUITE" = "mobile" ]; then
            pnpm run test:mobile
          else
            pnpm run test
          fi

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Test Results & Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
